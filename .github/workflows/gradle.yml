name: Java CI/CD with Gradle and Docker

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

permissions:
  contents: read

jobs:
  build-docker-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for Gradle
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew clean bootJar

      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/gdg-project:latest .

      - name: Docker Hub Login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker Image to Docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/gdg-project:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-docker-image
    steps:
      - name: Setup SSH private key
        run: |
          echo "${{ secrets.SSH_KEY }}" > private_key.pem
          chmod 600 private_key.pem

      - name: Debug SSH connection
        run: ssh -o StrictHostKeyChecking=no -i private_key.pem ${{ secrets.AZURE_VM_USER }}@${{ secrets.AZURE_VM_HOST }} "echo ✅ SSH 접속 성공!"

      - name: SSH to Azure VM and Deploy
        uses: appleboy/ssh-action@v0.1.3
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            echo "✅ Stopping old container..."
            sudo docker stop gdg-container || true
            sudo docker rm gdg-container || true

            echo "✅ Pulling latest image..."
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/gdg-project:latest

            echo "✅ Running new container..."
            sudo docker run -d --name gdg-container -p 8080:8080 \
              -e JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}" \
              -e JWT_ACCESS_TOKEN_TIME="${{ secrets.JWT_ACCESS_TOKEN_TIME }}" \
              -e JWT_REFRESH_TOKEN_TIME="${{ secrets.JWT_REFRESH_TOKEN_TIME }}" \
              -e AZURE_DB_USERNAME="${{ secrets.AZURE_DB_USERNAME }}" \
              -e AZURE_DB_PASSWORD="${{ secrets.AZURE_DB_PASSWORD }}" \
              -e AZURE_STORAGE_ACCOUNT="${{ secrets.AZURE_STORAGE_ACCOUNT }}" \
              -e AZURE_STORAGE_KEY="${{ secrets.AZURE_STORAGE_KEY }}" \
              -e KEY_STORE_PASSWORD="${{ secrets.KEY_STORE_PASSWORD }}" \
              -e NAVER_API_ID="${{ secrets.NAVER_API_ID }}" \
              -e NAVER_API_SECRET="${{ secrets.NAVER_API_SECRET }}" \
              -e LOCAL_DB_NAME="${{ secrets.LOCAL_DB_NAME }}" \
              -e LOCAL_DB_PW="${{ secrets.LOCAL_DB_PW }}" \
              ${{ secrets.DOCKER_USERNAME }}/gdg-project:latest
