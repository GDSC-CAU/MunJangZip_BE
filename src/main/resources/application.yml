spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 로컬 테스트용
    # url: jdbc:mysql://localhost:3306/gdg
    # username: ${LOCAL_DB_NAME}
    # password: ${LOCAL_DB_PW}

    # Azure Database for MySQL (Flexible Server) 배포용
    url: jdbc:mysql://munjangzip-db.mysql.database.azure.com:3306/gdg_db?useSSL=true&requireSSL=true
    username: ${AZURE_DB_USERNAME}      # ex. root@munjangzip-db
    password: ${AZURE_DB_PASSWORD}

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        show_sql: true
        format_sql: true
        use_sql_comments: true
        hbm2ddl:
          auto: update       # ※운영 환경에서는 create → update 로만 쓰세요
        default_batch_fetch_size: 1000

  sql:
    init:
      mode: never

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
azure:
  storage:
    account-name: ${AZURE_STORAGE_ACCOUNT}
    account-key:  ${AZURE_STORAGE_KEY}
    endpoint:     https://${AZURE_STORAGE_ACCOUNT}.blob.core.windows.net
    container-name: munjangzip
    path:
      file: books
      book: book
jwt:
  secret: ${JWT_SECRET_KEY}
  access-token-validity: ${JWT_ACCESS_TOKEN_TIME}
  refresh-token-validity: ${JWT_REFRESH_TOKEN_TIME}